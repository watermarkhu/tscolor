[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tscolor"
version = "0.1.0"
description = "Pure Python implementation of tree-sitter-highlight for syntax highlighting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "tscolor contributors"}
]
keywords = ["syntax-highlighting", "tree-sitter", "highlighting", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "tree-sitter>=0.20.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
python = ["tree-sitter-python>=0.20.0"]
javascript = ["tree-sitter-javascript>=0.20.0"]
matlab = ["tree-sitter-matlab>=1.2.6"]

[dependency-groups]
dev = [
    "prek>=0.2.13",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.14.3",
    "ty>=0.0.1a25",
]

[project.scripts]
tscolor = "tscolor.cli:main"

[project.urls]
Homepage = "https://github.com/watermarkhu/tscolor"
Repository = "https://github.com/watermarkhu/tscolor"

[tool.setuptools.packages.find]
where = ["."]
include = ["tscolor*"]

[tool.setuptools.package-data]
tscolor = [
    "languages/**/*.scm",
    "themes/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage options removed temporarily - add back after fixing pytest-cov
# addopts = "-v --cov=tscolor --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
